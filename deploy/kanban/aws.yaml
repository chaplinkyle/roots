AWSTemplateFormatVersion: '2010-09-09'
Description: Roots Kanban - one Fargate application, private PostgreSQL, TLS ALB, and generated credentials.
Parameters:
  DomainName:
    Type: String
    Description: New application hostname in the supplied Route 53 zone.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+[a-z0-9]'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CertificateArn:
    Type: String
    Description: Issued ACM certificate covering DomainName in this region.
  ImageTag:
    Type: String
    AllowedPattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}'
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Start at zero; deploy.py runs migrations before enabling the service.
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.84.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-network'}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  Attachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Network, InternetGatewayId: !Ref Gateway}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Network, CidrBlock: 10.84.1.0/24, AvailabilityZone: !Select [0, !GetAZs '']}
  PublicB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Network, CidrBlock: 10.84.2.0/24, AvailabilityZone: !Select [1, !GetAZs '']}
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Network, CidrBlock: 10.84.11.0/24, AvailabilityZone: !Select [0, !GetAZs '']}
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Network, CidrBlock: 10.84.12.0/24, AvailabilityZone: !Select [1, !GetAZs '']}
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Network}
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: Attachment
    Properties: {RouteTableId: !Ref Routes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway}
  RouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref Routes}
  RouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref Routes}
  AlbSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and HTTP redirect for Roots Kanban
      VpcId: !Ref Network
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 10.84.0.0/16}
  AppSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the ALB can reach the application
      VpcId: !Ref Network
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurity}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 10.84.0.0/16}
  DatabaseSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts only the Roots application security group
      VpcId: !Ref Network
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurity}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32}
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated Kanban database subnets
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Roots Kanban database owner password
      GenerateSecretString: {PasswordLength: 40, ExcludePunctuation: true}
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Roots Kanban bootstrap admin login password
      GenerateSecretString: {PasswordLength: 40, ExcludePunctuation: true}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '16.13'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: roots_kanban
      MasterUsername: roots_kanban
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString}}'
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurity]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {RetentionInDays: 30}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: KanbanSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: [!Ref DatabaseSecret, !Ref AdminSecret]}]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: temporary}]
      ContainerDefinitions:
        - Name: kanban
          Image: !Sub '${Repository.RepositoryUri}:${ImageTag}'
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          StopTimeout: 45
          MountPoints: [{SourceVolume: temporary, ContainerPath: /tmp}]
          PortMappings: [{ContainerPort: 8080}]
          Environment:
            - {Name: KANBAN_JDBC_URL, Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/roots_kanban?sslmode=verify-full&sslrootcert=/opt/roots/rds-ca.pem&connectTimeout=5&socketTimeout=15'}
            - {Name: KANBAN_JDBC_USER, Value: roots_kanban}
            - {Name: KANBAN_AUTH, Value: local}
            - {Name: KANBAN_SECURE_COOKIES, Value: 'true'}
            - {Name: KANBAN_TRUSTED_PROXIES, Value: 10.84.0.0/16}
            - {Name: SERVER_FORWARD_HEADERS_STRATEGY, Value: native}
            - {Name: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES, Value: '10\.84\.\d{1,3}\.\d{1,3}'}
          Secrets:
            - {Name: KANBAN_JDBC_PASSWORD, ValueFrom: !Ref DatabaseSecret}
            - {Name: KANBAN_ADMIN_PASSWORD, ValueFrom: !Ref AdminSecret}
          HealthCheck:
            Command: [CMD, java, '-XX:MaxRAMPercentage=10', -cp, /opt/roots/health, Healthcheck]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: kanban}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSecurity]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Network
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '45'}
        - {Key: stickiness.enabled, Value: 'true'}
        - {Key: stickiness.type, Value: lb_cookie}
        - {Key: stickiness.lb_cookie.duration_seconds, Value: '86400'}
  Https:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  Http:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  Dns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID}
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Https, InternetRoute, RouteA, RouteB]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref Task
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      LoadBalancers: [{ContainerName: kanban, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicA, !Ref PublicB]
          SecurityGroups: [!Ref AppSecurity]
Outputs:
  Url: {Value: !Sub 'https://${DomainName}/app/'}
  Repository: {Value: !GetAtt Repository.RepositoryUri}
  Cluster: {Value: !Ref Cluster}
  Service: {Value: !GetAtt Service.Name}
  TaskDefinition: {Value: !Ref Task}
  AppSecurityGroup: {Value: !Ref AppSecurity}
  TaskSubnet: {Value: !Ref PublicA}
  AdminSecretArn: {Value: !Ref AdminSecret}
  DatabaseSecretArn: {Value: !Ref DatabaseSecret}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  Logs: {Value: !Ref Logs}
