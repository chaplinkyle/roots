apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roots-backend-ingress
spec:
  podSelector:
    matchLabels: {app: roots-application}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: roots-proxy}
      ports:
        - {protocol: TCP, port: 8080}
