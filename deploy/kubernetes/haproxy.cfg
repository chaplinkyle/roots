global
    log stdout format raw local0
    maxconn 2048
    hard-stop-after 40s
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    # SSE URLs contain view credentials: omit URI, query, cookies, and headers.
    log-format "roots.proxy client=%ci frontend=%ft backend=%b/%s status=%ST bytes=%B duration_ms=%Ta"
    timeout connect 5s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout client 65s
    timeout server 65s
    retries 0

resolvers kubernetes
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend health
    bind :8081
    monitor-uri /health

frontend web
    bind :8443 ssl crt /etc/roots/tls/tls.pem alpn h2,http/1.1
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto https
    default_backend roots

backend roots
    balance roundrobin
    cookie ROOTS_NODE insert indirect nocache httponly secure attr "SameSite=Lax"
    option httpchk
    http-check send meth GET uri /_roots/health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Explicit stable owners; add/remove a server entry together with replica changes.
    server roots-0 roots-0.roots-headless.roots.svc.cluster.local:8080 check inter 2s cookie zero resolvers kubernetes init-addr none
    server roots-1 roots-1.roots-headless.roots.svc.cluster.local:8080 check inter 2s cookie one resolvers kubernetes init-addr none
