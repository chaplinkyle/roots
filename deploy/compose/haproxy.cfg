global
    log stdout format raw local0
    maxconn 2048
    hard-stop-after 40s

defaults
    mode http
    log global
    # SSE URLs contain view credentials: omit URI, query, cookies, and headers.
    log-format "roots.proxy client=%ci frontend=%ft backend=%b/%s status=%ST bytes=%B duration_ms=%Ta"
    timeout connect 5s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout client 65s
    timeout server 65s
    retries 0

resolvers docker
    nameserver local 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend web
    bind :8080
    # This frontend terminates local HTTP itself. Never accept client-supplied forwarding chains.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto http
    default_backend roots

backend roots
    balance roundrobin
    # Cookie selects a JVM. Component state is not replicated to the other JVM.
    cookie ROOTS_NODE insert indirect nocache httponly attr "SameSite=Lax"
    option httpchk
    http-check send meth GET uri /_roots/health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # HAProxy streams SSE as it arrives. Do not add response buffering or mutation retries.
    server roots-a roots-a:8080 check inter 2s fall 2 rise 2 cookie a resolvers docker init-addr libc,none
    server roots-b roots-b:8080 check inter 2s fall 2 rise 2 cookie b resolvers docker init-addr libc,none
