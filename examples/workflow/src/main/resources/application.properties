spring.application.name=roots-workflow
spring.threads.virtual.enabled=true
server.port=${ROOTS_PORT:8080}
server.address=${WORKFLOW_BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WORKFLOW_SECURE_COOKIES:true}
server.servlet.session.timeout=30m
roots.transport=servlet
roots.development=false
roots.servlet-path=/app
roots.max-sessions=1000
roots.max-live-views=1000
roots.max-concurrent-requests=1128
roots.secure-cookies=${WORKFLOW_SECURE_COOKIES:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,roots,workflowDatabase
workflow.auth=${WORKFLOW_AUTH:oidc}
