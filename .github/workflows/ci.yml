name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check repository boundaries and documentation
        run: python3 tools/check_repository.py
      - name: Scan Git history for secrets
        run: |
          mkdir -p .tooling/security
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output .tooling/security/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tooling/security/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tooling/security/gitleaks.tar.gz -C .tooling/security gitleaks
          .tooling/security/gitleaks git . --redact --log-opts=--all

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ["25", "26"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify and install reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean install

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-${{ matrix.java }}-verification
          path: |
            **/target/surefire-reports/**
            **/target/screenshots/**

      - name: Generate and verify an application
        run: |
          ./mvnw --batch-mode --no-transfer-progress archetype:generate \
            -DarchetypeGroupId=com.chaplin.roots \
            -DarchetypeArtifactId=roots-archetype \
            -DarchetypeVersion=0.1.0-SNAPSHOT \
            -DgroupId=com.chaplin.roots.smoke \
            -DartifactId=generated-smoke-app \
            -Dversion=1.0.0-SNAPSHOT \
            -Dpackage=com.chaplin.roots.smoke \
            -DrootsVersion=0.1.0-SNAPSHOT \
            -DinteractiveMode=false \
            -DarchetypeCatalog=local \
            -DoutputDirectory=target/archetype-smoke
          ./mvnw --batch-mode --no-transfer-progress \
            -f target/archetype-smoke/generated-smoke-app/pom.xml verify

  postgres-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: roots_receipts_test
          POSTGRES_USER: roots_test
          POSTGRES_PASSWORD: roots_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U roots_test -d roots_receipts_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ROOTS_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/roots_receipts_test?connectTimeout=5&socketTimeout=15
      ROOTS_TEST_POSTGRES_USER: roots_test
      ROOTS_TEST_POSTGRES_PASSWORD: roots_ci_ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify transactional receipts against PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -pl examples/automation -am -Proots-postgres verify
      - name: Verify packaged automation and interrupted delivery
        run: python3 examples/automation/verify_packaged.py
      - name: Verify customer transactions on PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -pl examples/workflow -am test -Dtest=CustomerPostgresTest -Dsurefire.failIfNoSpecifiedTests=false

  kanban-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify PostgreSQL browser and restart behavior
        run: python3 examples/kanban/verify.py --maven ./mvnw --java "$JAVA_HOME/bin/java"

  deployment-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate cloud templates without deploying
        run: |
          python3 -m venv .tooling/cloud-validation
          .tooling/cloud-validation/bin/pip install cfn-lint==1.56.0 PyYAML==6.0.3
          .tooling/cloud-validation/bin/cfn-lint deploy/aws/automation.yaml
          .tooling/cloud-validation/bin/cfn-lint deploy/kanban/aws.yaml
          curl --fail --location --silent --show-error https://github.com/Azure/bicep/releases/download/v0.46.1/bicep-linux-x64 --output .tooling/bicep
          chmod +x .tooling/bicep
          .tooling/bicep build deploy/azure/automation.bicep --outfile .tooling/azure-template.json
          .tooling/cloud-validation/bin/python deploy/gcp/validate.py deploy/gcp/automation.yaml
      - name: Verify local release integrity tooling
        run: |
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and verify the packaged Servlet deployment
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl examples/servlet -am package -DskipTests
          docker build -f deploy/servlet/Dockerfile -t roots-servlet:local .
          python3 deploy/servlet/verify.py
