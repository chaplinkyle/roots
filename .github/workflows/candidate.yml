name: Unpublished candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Non-snapshot candidate version, e.g. 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify versioned source and repeat artifact build
        env:
          ROOTS_CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/release.py build --version "$ROOTS_CANDIDATE_VERSION" --output .tooling/candidate --rebuild
      - name: Verify a fresh consumer of the candidate repository
        run: python3 tools/release.py smoke .tooling/candidate --output .tooling/consumer
      - name: Preserve candidate and verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unpublished-roots-candidate
          if-no-files-found: error
          path: |
            .tooling/candidate/roots-*-bundle.zip*
            .tooling/candidate/release-manifest.json
            .tooling/candidate/*.log
            .tooling/consumer/*.log
            .tooling/consumer/consumer-evidence.json
